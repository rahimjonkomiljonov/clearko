[project]
name = "clearko-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "pydantic>=2",
  "pydantic-settings",
]

[project.optional-dependencies]
# For an NVIDIA GPU install paddlepaddle-gpu instead of paddlepaddle (see README)
ocr = ["paddlepaddle", "paddleocr"]
llm = ["google-genai"]
pdf = ["pymupdf"]
api = ["fastapi", "uvicorn", "python-multipart"]
# Uzbek translation with Meta NLLB-200 (weights are CC-BY-NC 4.0: NON-COMMERCIAL use only).
# For an NVIDIA GPU install torch first from the CUDA index (see README).
# torch is pinned to the build that uses the same CUDA libraries as paddlepaddle-gpu 3.3.1 (cu126).
uz = ["torch==2.7.1", "transformers", "sentencepiece"]
dev = ["pytest", "ruff", "mypy", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real OCR models"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
